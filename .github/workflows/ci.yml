name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  frontend:
    name: Frontend (Svelte + Tailwind)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx svelte-check --output human
      - run: npm run build
      - run: npm run smoke

  ml:
    name: ML (FastAPI + scikit-learn)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m duration_model.train
      - run: python -m evaluation.sanity_check
      - run: python -m evaluation.geolife_validation
      - name: Run ML tests
        run: |
          set +e
          python -m pytest -q tests 2>&1 | tee /tmp/ml-tests.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Surface the failure as annotations: job logs live on a host the
            # PR-comment channel cannot reach, annotations are the readable
            # path. Budget is ~10 per step — assertion (E) lines first, then
            # the FAILED summary, then resolved versions on one line.
            {
              grep -E '^(E |FAILED )' /tmp/ml-tests.log | head -8
              echo "versions: $(pip list --format=freeze 2>/dev/null | grep -E '^(fastapi|starlette|httpx|pydantic|pytest|anyio)=' | tr '\n' ' ')"
            } | cut -c1-450 | while IFS= read -r line; do
              if [ -n "$line" ]; then echo "::error::$line"; fi
            done
            exit "$code"
          fi

  backend:
    name: API (Laravel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_pgsql, pgsql, pdo_sqlite, sqlite3
          coverage: none
      - name: Lint every PHP file
        run: |
          find backend -name '*.php' -not -path '*/vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /tmp/lint.txt || (cat /tmp/lint.txt && exit 1)
          echo "PHP lint clean"
      - name: Check Supabase baseline and security migration
        run: |
          python3 supabase/tests/check_baseline.py
          php backend/scripts/test_supabase_security_migration.php
          php backend/scripts/test_email_otp_security_migration.php
          php backend/scripts/test_user_profile_migration.php
          php backend/scripts/test_database_config.php
      - name: Validate composer.json
        run: composer validate --no-check-publish --working-dir=backend
      # No composer.lock is committed in this repo, so `install` cannot work —
      # resolve dependencies instead. (Maintainers: consider committing a lock file.)
      - name: Install dependencies
        id: install-dependencies
        working-directory: backend
        run: composer update --no-interaction --prefer-dist --no-progress
      - name: Smoke-test the local Laravel server
        working-directory: backend
        run: |
          APP_ENV=testing \
          APP_KEY="base64:$(printf '%032d' 0 | base64 | tr -d '\n')" \
          DB_CONNECTION=sqlite DB_DATABASE=:memory: CACHE_STORE=array SESSION_DRIVER=array \
          php artisan serve --host=127.0.0.1 --port=18001 --no-reload > "$RUNNER_TEMP/trana-serve.log" 2>&1 &
          server_pid=$!
          trap 'pkill -P "$server_pid" 2>/dev/null || true; kill "$server_pid" 2>/dev/null || true' EXIT
          if ! curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:18001/up > /dev/null; then
            cat "$RUNNER_TEMP/trana-serve.log"
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:18001/api/docs \
            | python3 -c 'import json, sys; assert json.load(sys.stdin)["name"] == "TRANA API"'
      - name: Test HttpOnly-cookie authentication and CSRF over HTTP
        id: http-smoke
        working-directory: backend
        run: |
          set +e
          python3 scripts/test_stateless_api_http.py 2>&1 | tee /tmp/trana-http-smoke.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            tail -12 /tmp/trana-http-smoke.log | cut -c1-450 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
            exit "$code"
          fi
      - name: Run backend tests
        if: ${{ !cancelled() && steps.install-dependencies.outcome == 'success' }}
        working-directory: backend
        run: |
          set +e
          # Provide a .env so framework boots don't emit transient
          # "file_get_contents(.../.env): Failed to open stream" warnings that
          # flood the 10-annotation budget (phpunit env vars still override).
          cp .env.example .env
          php artisan test 2>&1 | tee /tmp/trana-tests.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Surface the failure details as annotations (viewable via the API).
            # GitHub allows only ~10 per step: lead with the decisive block —
            # PHPUnit's FAILURES!/ERRORS! section (assertions + summary) — and
            # only fall back to class lines / log tail when there is none.
            plain=$(sed -E 's/\x1b\[[0-9;]*m//g' /tmp/trana-tests.log)
            if printf '%s\n' "$plain" | grep -qE '(FAILURES|ERRORS)!'; then
              # From the first "N) test_name" entry: method, assertion message,
              # code frame, FAILURES! header and the Tests: summary — the full
              # verdict in one block (fall back to the header range if there is
              # no numbered entry, e.g. boot/migration errors).
              if printf '%s\n' "$plain" | grep -qE '^[[:space:]]*[0-9]+\) '; then
                printf '%s\n' "$plain" | sed -n '/^[[:space:]]*[0-9][0-9]*) /,$p' | cut -c1-450 | head -10
              else
                printf '%s\n' "$plain" | sed -n '/\(FAILURES\|ERRORS\)!/,$p' | cut -c1-450 | head -10
              fi
            else
              {
                printf '%s\n' "$plain" | grep -E 'Tests:|^[[:space:]]*OK \(|WARN  |FAIL  ' | head -6
                printf '%s\n' "$plain" | tail -8
              } | cut -c1-450 | head -10
            fi | while IFS= read -r line; do [ -n "$line" ] && echo "::error::$line"; done
            exit "$code"
          fi

      - name: Publish failure log to the PR
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Annotations cap at 10/step (this step gets its own budget) and CI
          # job logs are unreachable from outside (blob EOF) — emit the
          # numbered failure entry here AND post the full log to the PR.
          if [ -f /tmp/trana-tests.log ]; then
            plain=$(sed -E 's/\x1b\[[0-9;]*m//g' /tmp/trana-tests.log)
            block=$(printf '%s\n' "$plain" \
              | grep -E -A6 '^[[:space:]]*[0-9]+\) |Failed asserting|FAILURES!|ERRORS!' \
              | head -9 || true)
            if [ -z "$block" ]; then
              block=$(printf '%s\n' "$plain" | tail -9)
            fi
            printf '%s\n' "$block" | cut -c1-450 | while IFS= read -r line; do
              if [ -n "$line" ]; then echo "::error::$line"; fi
            done
          fi
          if [ -f /tmp/trana-tests.log ] && [ -n "$PR_NUMBER" ]; then
            {
              echo "<!-- trana-test-log -->"
              echo "### Backend test log (run ${{ github.run_id }})"
              echo '```'
              sed -E 's/\x1b\[[0-9;]*m//g' /tmp/trana-tests.log | tail -250
              echo '```'
            } > /tmp/comment.md
            if gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --paginate \
                --jq '(.[] | select((.body? // "") | startswith("<!-- trana-test-log -->")) | .id)' \
                > /tmp/old-ids.txt; then
              while IFS= read -r cid; do
                if [ -n "$cid" ]; then
                  gh api -X DELETE "repos/${{ github.repository }}/issues/comments/$cid" >/dev/null \
                    || echo "::warning::Could not delete stale test-log comment $cid"
                fi
              done < /tmp/old-ids.txt
            else
              echo "::warning::Could not list PR comments"
            fi
            if gh api -X POST "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
                -F body=@/tmp/comment.md > /dev/null; then
              echo "Published test log to PR #$PR_NUMBER"
            else
              echo "::error::Failed to post test-log comment to PR #$PR_NUMBER (token permissions?)"
            fi
          fi
